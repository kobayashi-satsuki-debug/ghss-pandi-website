# Copy this file to .github/workflows/keep-supabase-awake.yml in the repository.
# It pings the Supabase project once a day so a free project is never paused
# for inactivity. The database URL and publishable key are already public in
# js/config.js, so no secret has to be added.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ping the database and the auth service
        run: node scripts/ping-supabase.mjs
